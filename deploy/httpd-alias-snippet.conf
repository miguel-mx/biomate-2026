# Paste this into your existing site's config file (wherever you already
# define the "Alias /2da-embm ..." line), e.g. /etc/httpd/conf.d/yoursite.conf
#
# After editing:
#   sudo apachectl configtest
#   sudo systemctl restart httpd
#
# Note: the RewriteEngine/RewriteCond/RewriteRule directives MUST live inside
# the <Directory> block that matches the Alias target (not a bare top-level
# RewriteRule next to the Alias line). Apache's per-directory rewrite context
# automatically strips the "/2da-embm" prefix before matching and re-adds it
# on internal substitutions, which is exactly what makes this work correctly
# together with Alias. Putting the same rules at server/vhost top level
# instead is the classic way this breaks (module ordering between mod_alias
# and mod_rewrite becomes ambiguous).

Alias /2da-embm /var/www/html/2da-embm

<Directory /var/www/html/2da-embm>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    RewriteEngine On

    # Canonicalize: /2da-embm/page.html -> /2da-embm/page (permanent redirect)
    RewriteCond %{THE_REQUEST} \s/+(.+?)\.html[\s?] [NC]
    RewriteRule ^ /%1 [R=301,L]

    # Internally serve page.html when /2da-embm/page is requested
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_FILENAME}\.html -f
    RewriteRule ^([^.]+)$ $1.html [L]
</Directory>
